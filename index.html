<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Reaktionsgleichungen üben · Chemie</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#193329;background:#f5f8f5;--green:#146344;--dark:#143e30;--line:#cbdcd1;--pale:#e8f4eb;--amber:#79500c;--bad:#ad3732}
    *{box-sizing:border-box}body{margin:0;line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.52}
    .top{background:var(--dark);color:white;padding:20px max(20px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;gap:20px;align-items:center}
    .top h1{font-size:1.5rem;margin:0}.top p{margin:3px 0 0;color:#d7e8db;font-size:.94rem}.top .count{font-weight:bold;white-space:nowrap;background:#275b42;padding:7px 12px;border-radius:10px}
    main{max-width:1100px;margin:auto;padding:24px 20px 60px}.intro{margin:0 0 19px;color:#435a4b}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
    .side,.card{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 15px #123b2410}.side{padding:18px}.side h2{font-size:1.01rem;margin:0 0 13px}.side label{display:block;font-weight:700;font-size:.9rem;margin:15px 0 6px}
    select{width:100%;border:1px solid #849c8e;border-radius:8px;padding:10px;background:white;color:#193329}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
    .nav button,.button{border:1px solid #abc2b0;border-radius:9px;padding:9px 11px;background:white;color:#1d4a35;font-weight:700}.nav button:hover,.button:hover{background:#e7f3e8}
    .small{font-size:.83rem;color:#526558}.progress{margin:19px 0 7px;background:#e9f1e9;border-radius:999px;height:9px;overflow:hidden}.progress span{display:block;background:#248657;height:100%;width:0;transition:width .3s}
    .card{padding:26px 30px}.eyebrow{font-size:.8rem;font-weight:bold;letter-spacing:.07em;text-transform:uppercase;color:var(--green);margin:0 0 6px}.card h2{font-size:1.48rem;line-height:1.27;margin:0 0 11px}.word{background:#f0f6ef;border-left:4px solid #268452;border-radius:0 8px 8px 0;padding:13px 16px;margin:17px 0 20px;font-size:1.07rem;font-weight:600}
    .steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.step{font-size:.85rem;border:1px solid #c8d9cc;border-radius:50px;padding:5px 11px;color:#516559}.step.active{background:#e3f2e7;color:#115d3c;border-color:#61ad7c;font-weight:bold}.step.done{color:#166c46;border-color:#8cbaa0}
    .instruction{font-size:.95rem;margin:0 0 14px;color:#3d5247}.equation{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 16px;padding:16px;background:#fbfcfb;border:1px dashed #b8cebd;border-radius:11px}.group{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0}.species{display:grid;gap:5px;min-width:118px}.species label{font-size:.78rem;color:#526458;font-weight:700}.species input{width:100%;border:1.5px solid #9bb6a4;border-radius:8px;padding:9px 10px;background:white;color:#193329;font-weight:700;font-size:1.12rem;letter-spacing:.02em}.species input:focus,.coef:focus,select:focus,button:focus-visible{outline:3px solid #90c9a7;outline-offset:2px}.species input.wrong{border-color:var(--bad);background:#fff4f3}.species input.correct{border-color:#348d5d;background:#f0faf2}.species .read-formula{padding:9px 4px;min-height:45px;font-size:1.35rem;font-weight:bold;white-space:nowrap}.species sub,.eq-output sub{font-size:.65em;vertical-align:sub}.sep{font-size:1.35rem;color:#4a6556;font-weight:700;align-self:end;margin-bottom:5px}.arrow{font-size:1.5rem;color:#176846;align-self:end;margin-bottom:4px}.coef-wrap{display:flex;align-items:end;gap:4px}.coef{width:56px;height:45px;border:1.5px solid #9bb6a4;border-radius:8px;text-align:center;font-weight:700;font-size:1.15rem}.coef.wrong{border-color:var(--bad);background:#fff4f3}
    .action-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.primary{border:1px solid var(--green);background:var(--green);color:white;border-radius:9px;padding:10px 18px;font-weight:700}.primary:hover{background:#0f5037}.feedback{margin-top:16px;border-radius:9px;padding:12px 14px;background:#f0f5ef;border-left:4px solid #859e88;min-height:48px}.feedback.good{border-color:#278253;background:#e9f6ec;color:#17472b}.feedback.bad{border-color:#c88729;background:#fff7e7;color:#65440c}.feedback p{margin:0}.feedback p+p{margin-top:5px}
    .atoms{border-collapse:collapse;margin:14px 0 0;max-width:430px;width:100%;font-size:.89rem}.atoms th,.atoms td{padding:5px 9px;text-align:center;border-bottom:1px solid #dce7dd}.atoms th:first-child,.atoms td:first-child{text-align:left}.atoms .mismatch{color:#a63e2f;font-weight:bold}.atoms .match{color:#167349}
    .hint-area{margin-top:17px;font-size:.89rem;color:#526458}.hint-area button{font-weight:700;color:#176345;background:none;border:0;text-decoration:underline;text-underline-offset:3px;padding:0}.hint-text{margin:9px 0 0;border-left:3px solid #bfcfbf;padding-left:11px;color:#3c5144}.finish{background:#eaf6ec;border-radius:12px;padding:20px;margin-top:13px}.finish h3{margin:0 0 7px}.finish p{margin:0 0 14px}.eq-output{font-weight:bold;font-size:1.25rem;line-height:1.6;overflow-wrap:anywhere}
    .tip{font-size:.85rem;border-top:1px solid #e4ece4;margin-top:21px;padding-top:14px;color:#536656}.tip strong{color:#344c3c}
    @media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;column-gap:13px}.side h2,.side .progress,.side .small{grid-column:1/-1}.side label{margin-top:4px}.nav{margin:4px 0 0}.card{padding:20px}.top{padding:16px 20px}.top h1{font-size:1.25rem}.top p{font-size:.8rem}.top .count{font-size:.8rem}}@media(max-width:480px){.side{display:block}.nav{margin-top:13px}.top{align-items:start}.top .count{white-space:normal;text-align:center;min-width:88px}.card h2{font-size:1.3rem}.species{min-width:104px}.equation{gap:7px;padding:12px}}
  </style>
</head>
<body>
  <header class="top"><div><h1>Reaktionsgleichungen üben</h1><p>Stoffformeln finden · Teilchenzahlen ausgleichen</p></div><div class="count" id="counter" aria-live="polite"></div></header>
  <main>
    <p class="intro">Lies das Reaktionsschema. Trage zuerst alle Stoffformeln ein. Danach stellst du vor die Formeln die passenden Zahlen.</p>
    <div class="layout">
      <aside class="side" aria-label="Übung auswählen">
        <h2>Deine Übung</h2>
        <div><label for="category">Themenbereich</label><select id="category"></select></div>
        <div><label for="exercise">Aufgabe</label><select id="exercise"></select></div>
        <div class="nav"><button id="previous" type="button">← Zurück</button><button id="next" type="button">Weiter →</button></div>
        <div class="progress" role="progressbar" aria-label="Gelöste Aufgaben" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div><div class="small" id="progress-label"></div>
      </aside>
      <section class="card" id="workspace" aria-live="off"></section>
    </div>
  </main>
  <script>
  'use strict';
  // Jede Aufgabe: Wortgleichung und exakt zugeordnete Stoffformeln in gleicher Reihenfolge.
  const categories = [
    {id:'oxidation', name:'Oxidationen und Verbrennungen'},
    {id:'salt', name:'Salze aus Metall und Nichtmetall'},
    {id:'iron', name:'Eisengewinnung und Stahl'},
    {id:'ore', name:'Metalle aus Erzen'},
    {id:'halogen', name:'Halogene und Wasserstoff'}
  ];
  const tasks = [
    {id:'o1',cat:'oxidation',title:'Magnesium verbrennt',lhs:[['Magnesium','Mg'],['Sauerstoff','O2']],rhs:[['Magnesiumoxid','MgO']],tip:'Sauerstoff liegt als O₂-Molekül vor; Magnesiumoxid enthält Mg und O im Verhältnis 1 : 1.'},
    {id:'o2',cat:'oxidation',title:'Aluminium verbrennt',lhs:[['Aluminium','Al'],['Sauerstoff','O2']],rhs:[['Aluminiumoxid','Al2O3']],tip:'Aluminiumoxid enthält zwei Aluminium- und drei Sauerstoffatome pro Formeleinheit.'},
    {id:'o3',cat:'oxidation',title:'Schwefel verbrennt',lhs:[['Schwefel','S'],['Sauerstoff','O2']],rhs:[['Schwefeldioxid','SO2']],tip:'„Di“ bedeutet zwei: Das Produkt enthält zwei O-Atome.'},
    {id:'o4',cat:'oxidation',title:'Kohlenstoff verbrennt vollständig',lhs:[['Kohlenstoff','C'],['Sauerstoff','O2']],rhs:[['Kohlenstoffdioxid','CO2']],tip:'Bei vollständiger Verbrennung entsteht CO₂.'},
    {id:'o5',cat:'oxidation',title:'Unvollständige Kohlenstoffverbrennung',lhs:[['Kohlenstoff','C'],['Sauerstoff','O2']],rhs:[['Kohlenstoffmonoxid','CO']],tip:'„Mono“ bedeutet ein Sauerstoffatom im CO. Sauerstoff links ist dennoch O₂.'},
    {id:'o6',cat:'oxidation',title:'Methan verbrennt',lhs:[['Methan','CH4'],['Sauerstoff','O2']],rhs:[['Kohlenstoffdioxid','CO2'],['Wasser','H2O']],tip:'Methan ist CH₄. Gleiche erst C und H aus, danach O.'},
    {id:'o7',cat:'oxidation',title:'Propan verbrennt',lhs:[['Propan','C3H8'],['Sauerstoff','O2']],rhs:[['Kohlenstoffdioxid','CO2'],['Wasser','H2O']],tip:'Propan ist C₃H₈. Beginne beim Ausgleichen mit den drei C-Atomen.'},
    {id:'o8',cat:'oxidation',title:'Eisen bildet Magnetit',lhs:[['Eisen','Fe'],['Sauerstoff','O2']],rhs:[['Eisen(II,III)-oxid (Magnetit)','Fe3O4']],tip:'Magnetit hat die Formel Fe₃O₄; diese Form des Eisenoxids wird im Schema ausdrücklich genannt.'},
    {id:'s1',cat:'salt',title:'Natrium und Chlor',lhs:[['Natrium','Na'],['Chlor','Cl2']],rhs:[['Natriumchlorid','NaCl']],tip:'Elementares Chlor ist Cl₂. Natriumchlorid hat das Verhältnis 1 : 1.'},
    {id:'s2',cat:'salt',title:'Magnesium und Brom',lhs:[['Magnesium','Mg'],['Brom','Br2']],rhs:[['Magnesiumbromid','MgBr2']],tip:'Brom liegt als Br₂ vor. Mg²⁺ und Br⁻ ergeben MgBr₂.'},
    {id:'s3',cat:'salt',title:'Aluminium und Chlor',lhs:[['Aluminium','Al'],['Chlor','Cl2']],rhs:[['Aluminiumchlorid','AlCl3']],tip:'Al³⁺ und Cl⁻ führen zu AlCl₃; elementares Chlor ist Cl₂.'},
    {id:'s4',cat:'salt',title:'Eisen und Schwefel',lhs:[['Eisen','Fe'],['Schwefel','S']],rhs:[['Eisen(II)-sulfid','FeS']],tip:'Eisen(II) und Sulfid liegen hier im Verhältnis 1 : 1 vor.'},
    {id:'s5',cat:'salt',title:'Calcium und Fluor',lhs:[['Calcium','Ca'],['Fluor','F2']],rhs:[['Calciumfluorid','CaF2']],tip:'Elementares Fluor ist F₂; Calciumfluorid enthält zwei Fluoridionen pro Calciumion.'},
    {id:'s6',cat:'salt',title:'Zink und Iod',lhs:[['Zink','Zn'],['Iod','I2']],rhs:[['Zinkiodid','ZnI2']],tip:'Iod tritt als I₂ auf. Zinkiodid hat die Formel ZnI₂.'},
    {id:'i1',cat:'iron',title:'Kohlenmonoxid im Hochofen',lhs:[['Kohlenstoff','C'],['Kohlenstoffdioxid','CO2']],rhs:[['Kohlenstoffmonoxid','CO']],tip:'Kohlenstoff aus Koks reagiert mit CO₂ zu CO. Zähle zuerst die C-Atome.'},
    {id:'i2',cat:'iron',title:'Eisenoxid wird reduziert',lhs:[['Eisen(III)-oxid','Fe2O3'],['Kohlenstoffmonoxid','CO']],rhs:[['Eisen','Fe'],['Kohlenstoffdioxid','CO2']],tip:'Das Erz wird durch CO reduziert. Beginne mit den zwei Eisenatomen im Fe₂O₃.'},
    {id:'i3',cat:'iron',title:'Kalkstein im Hochofen',lhs:[['Calciumcarbonat','CaCO3']],rhs:[['Calciumoxid','CaO'],['Kohlenstoffdioxid','CO2']],tip:'Beim Erhitzen zerfällt CaCO₃ in CaO und CO₂.'},
    {id:'i4',cat:'iron',title:'Schlackenbildung',lhs:[['Calciumoxid','CaO'],['Siliciumdioxid','SiO2']],rhs:[['Calciumsilicat','CaSiO3']],tip:'Der Kalk bindet SiO₂ als CaSiO₃. Diese Aufgabe gehört zum Hochofen, auch wenn sie keine Redoxreaktion ist.'},
    {id:'i5',cat:'iron',title:'Kohlenstoff beim Frischen',lhs:[['Kohlenstoff','C'],['Sauerstoff','O2']],rhs:[['Kohlenstoffmonoxid','CO']],tip:'Beim Frischen wird Kohlenstoff oxidiert; hier ist ausdrücklich Kohlenstoffmonoxid das Produkt.'},
    {id:'i6',cat:'iron',title:'Silicium beim Frischen',lhs:[['Silicium','Si'],['Sauerstoff','O2']],rhs:[['Siliciumdioxid','SiO2']],tip:'Auch Silicium aus dem Roheisen reagiert mit eingeblasenem Sauerstoff.'},
    {id:'e1',cat:'ore',title:'Zinksulfid rösten',lhs:[['Zinksulfid','ZnS'],['Sauerstoff','O2']],rhs:[['Zinkoxid','ZnO'],['Schwefeldioxid','SO2']],tip:'Rösten bedeutet hier: Sulfid mit Sauerstoff zu Metalloxid und SO₂ umsetzen.'},
    {id:'e2',cat:'ore',title:'Zinkoxid mit Kohlenstoff reduzieren',lhs:[['Zinkoxid','ZnO'],['Kohlenstoff','C']],rhs:[['Zink','Zn'],['Kohlenstoffmonoxid','CO']],tip:'Sauerstoff aus ZnO geht hier auf Kohlenstoff über: CO entsteht.'},
    {id:'e3',cat:'ore',title:'Zinkoxid mit Kohlenstoffmonoxid reduzieren',lhs:[['Zinkoxid','ZnO'],['Kohlenstoffmonoxid','CO']],rhs:[['Zink','Zn'],['Kohlenstoffdioxid','CO2']],tip:'CO nimmt das O-Atom vom Zinkoxid auf und wird zu CO₂.'},
    {id:'e4',cat:'ore',title:'Bleisulfid rösten',lhs:[['Blei(II)-sulfid','PbS'],['Sauerstoff','O2']],rhs:[['Blei(II)-oxid','PbO'],['Schwefeldioxid','SO2']],tip:'Aus dem Sulfid entsteht zunächst das Oxid; Schwefel wird als SO₂ abgegeben.'},
    {id:'e5',cat:'ore',title:'Bleioxid reduzieren',lhs:[['Blei(II)-oxid','PbO'],['Kohlenstoffmonoxid','CO']],rhs:[['Blei','Pb'],['Kohlenstoffdioxid','CO2']],tip:'CO nimmt dem Bleioxid den Sauerstoff weg.'},
    {id:'e6',cat:'ore',title:'Kupferoxid reduzieren',lhs:[['Kupfer(II)-oxid','CuO'],['Kohlenstoff','C']],rhs:[['Kupfer','Cu'],['Kohlenstoffdioxid','CO2']],tip:'Kupfer(II)-oxid ist CuO. Für CO₂ werden zwei Sauerstoffatome gebraucht.'},
    {id:'h1',cat:'halogen',title:'Wasserstoff und Fluor',lhs:[['Wasserstoff','H2'],['Fluor','F2']],rhs:[['Fluorwasserstoff','HF']],tip:'Wasserstoff und Fluor liegen als H₂ und F₂ vor.'},
    {id:'h2',cat:'halogen',title:'Wasserstoff und Chlor',lhs:[['Wasserstoff','H2'],['Chlor','Cl2']],rhs:[['Chlorwasserstoff','HCl']],tip:'Wasserstoff und Chlor liegen als zweiatomige Moleküle vor.'},
    {id:'h3',cat:'halogen',title:'Wasserstoff und Brom',lhs:[['Wasserstoff','H2'],['Brom','Br2']],rhs:[['Bromwasserstoff','HBr']],tip:'Links stehen H₂ und Br₂; die Produktformel lautet HBr.'},
    {id:'h4',cat:'halogen',title:'Wasserstoff und Iod',lhs:[['Wasserstoff','H2'],['Iod','I2']],rhs:[['Iodwasserstoff','HI']],tip:'Iod ist elementar I₂. Hier wird nur die stöchiometrische Gleichung aufgestellt; die Reaktion ist umkehrbar.'}
  ];
  const byId=id=>document.getElementById(id), category=byId('category'), picker=byId('exercise'), work=byId('workspace');
  const html=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const pretty=s=>html(s).replace(/(\d+)/g,'<sub>$1</sub>');
  function normalize(s){return String(s).trim().replace(/[\s\u00a0\u200b]/g,'').replace(/[₀-₉]/g,c=>String('₀₁₂₃₄₅₆₇₈₉'.indexOf(c))).normalize('NFKC')}
  function parseFormula(s){let pos=0,counts={};const f=normalize(s);if(!/^(?:[A-Z][a-z]?\d*)+$/.test(f))return null;for(const m of f.matchAll(/([A-Z][a-z]?)(\d*)/g)){let n=m[2]?Number(m[2]):1;if(!Number.isSafeInteger(n)||n<1)return null;counts[m[1]]=(counts[m[1]]||0)+n;pos+=m[0].length}return pos===f.length?counts:null}
  function gcd(a,b){while(b)[a,b]=[b,a%b];return a}
  const state={id:tasks[0].id,stage:1,hints:0,revealed:false,formulas:[],coefs:[]};
  let solved=new Set();try{const stored=JSON.parse(localStorage.getItem('chem-equations-solved-v1')||'[]');if(Array.isArray(stored))solved=new Set(stored.filter(id=>tasks.some(t=>t.id===id)))}catch(e){}
  function persist(){try{localStorage.setItem('chem-equations-solved-v1',JSON.stringify([...solved]))}catch(e){}}
  function task(){return tasks.find(t=>t.id===state.id)}
  function sides(t){return [...t.lhs,...t.rhs]}
  function filtered(){return tasks.filter(t=>category.value==='all'||t.cat===category.value)}
  function fillPicker(){picker.innerHTML=filtered().map((t,i)=>`<option value="${t.id}">${String(i+1).padStart(2,'0')} · ${html(t.title)}${solved.has(t.id)?' ✓':''}</option>`).join('');picker.value=state.id}
  function syncCounters(){byId('counter').textContent=`${solved.size} / ${tasks.length} gelöst`;byId('progress-label').textContent=`${solved.size} von ${tasks.length} Aufgaben vollständig gelöst`;byId('progress-fill').style.width=`${100*solved.size/tasks.length}%`;document.querySelector('.progress').setAttribute('aria-valuenow',String(Math.round(100*solved.size/tasks.length)))}
  function load(id){state.id=id;state.stage=1;state.hints=0;state.revealed=false;state.formulas=[];state.coefs=[];fillPicker();render()}
  function nav(n){const list=filtered(),idx=list.findIndex(t=>t.id===state.id);load(list[(idx+n+list.length)%list.length].id)}
  function speciesMarkup(item,index){const name=html(item[0]),formula=item[1];if(state.stage===1)return `<div class="species"><label for="f${index}">${name}</label><input id="f${index}" data-formula="${index}" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Formel für ${name}" value="${html(state.formulas[index]||'')}" placeholder="Formel"></div>`;return `<div class="coef-wrap"><input class="coef" data-coef="${index}" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Zahl vor ${name}" value="${html(state.coefs[index]||'')}" placeholder="1"><div class="species"><label>${name}</label><span class="read-formula">${pretty(formula)}</span></div></div>`}
  function sideMarkup(items,offset){return `<div class="group">${items.map((item,i)=>`${i?'<span class="sep" aria-hidden="true">+</span>':''}${speciesMarkup(item,offset+i)}`).join('')}</div>`}
  function render(){const t=task();syncCounters();const f=filtered(),idx=f.findIndex(x=>x.id===t.id);byId('previous').disabled=f.length<2;byId('next').disabled=f.length<2;const step=`<div class="steps" aria-label="Arbeitsschritte"><span class="step ${state.stage===1?'active':'done'}">1 · Stoffformeln</span><span class="step ${state.stage===2?'active':state.stage===3?'done':''}">2 · Ausgleichen</span></div>`;
    work.innerHTML=`<p class="eyebrow">${html(categories.find(c=>c.id===t.cat).name)} · Aufgabe ${idx+1} von ${f.length}</p><h2>${html(t.title)}</h2>${step}<p class="instruction">${state.stage===1?'Trage die Formeln der Stoffe ein. Schreibe Zahlen in der Formel normal, zum Beispiel H2O.':'Setze ganze Zahlen vor die Formeln. Eine 1 kannst du weglassen; die kleinen Zahlen in den Formeln bleiben gleich.'}</p><div class="word" aria-label="Reaktionsschema in Worten">${html(t.lhs.map(x=>x[0]).join(' + '))} → ${html(t.rhs.map(x=>x[0]).join(' + '))}</div><div class="equation" aria-label="Reaktionsgleichung">${sideMarkup(t.lhs,0)}<span class="arrow" aria-hidden="true">→</span>${sideMarkup(t.rhs,t.lhs.length)}</div><div class="action-row"><button class="primary" id="check" type="button">${state.stage===1?'Formeln prüfen':state.stage===2?'Ausgleich prüfen':'Noch einmal üben'}</button>${state.stage!==3?'<button class="button" id="show" type="button">Lösung anzeigen</button>':''}${state.stage===2?'<button class="button" id="back" type="button">Formeln bearbeiten</button>':''}</div><div class="feedback" id="feedback" role="status" aria-live="polite"><p>${state.stage===1?'Beginne mit den Formeln auf der linken Seite.':'Vergleiche bei Bedarf die Anzahl der Atome links und rechts.'}</p></div>${state.stage!==3?`<div class="hint-area"><button id="hint" type="button">Hinweis ${state.hints?'weiterlesen':'anzeigen'}</button><div class="hint-text" id="hint-text">${hintText()}</div></div>`:''}<div class="tip"><strong>Merke:</strong> Die tiefgestellten Zahlen gehören zur Stoffformel. Zum Ausgleichen änderst du nur die Zahlen <em>vor</em> der Formel.</div>`;
    if(state.stage===3)finish();
    byId('check').addEventListener('click',()=>{if(state.stage===3){load(t.id);return}state.stage===1?checkFormulas():checkCoefficients()});
    byId('show')?.addEventListener('click',showSolution);byId('back')?.addEventListener('click',()=>{saveCoefs();state.stage=1;render()});byId('hint')?.addEventListener('click',()=>{state.hints=Math.min(3,state.hints+1);byId('hint-text').innerHTML=hintText()});
    work.querySelectorAll('input').forEach(el=>el.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();byId('check').click()}}));
  }
  function hintText(){const t=task();if(!state.hints)return '';if(state.hints===1)return html(t.tip);if(state.hints===2)return state.stage===1?'Prüfe bei elementarem Wasserstoff, Sauerstoff und den Halogenen, ob die Teilchen aus zwei Atomen bestehen.':`Zähle links und rechts die Atome jedes Elements. Beginne mit einem Element, das nur in einem Stoff pro Seite vorkommt.`;return state.stage===1?'Eine Stoffformel darf vorne keine Ausgleichszahl enthalten. Beispiel: MgO statt 2MgO.':'Ändere beim Ausgleichen nur die grossen Zahlen vor den Formeln. In der Eingabe bedeutet ein leeres Feld die Zahl 1.'}
  function saveFormulas(){state.formulas=[...work.querySelectorAll('[data-formula]')].map(x=>x.value)}
  function saveCoefs(){state.coefs=[...work.querySelectorAll('[data-coef]')].map(x=>x.value)}
  function message(s,kind='bad',more=''){const box=byId('feedback');box.className='feedback '+kind;box.innerHTML=`<p>${s}</p>${more}`}
  function checkFormulas(){saveFormulas();const expected=sides(task());let wrong=[];work.querySelectorAll('[data-formula]').forEach((el,i)=>{const ok=normalize(el.value)===expected[i][1];el.classList.toggle('wrong',!ok);el.classList.toggle('correct',ok);if(!ok)wrong.push(i)});if(wrong.length){const first=wrong[0],name=expected[first][0];const sample=state.formulas[first]?.trim();message(`${wrong.length} ${wrong.length===1?'Formel stimmt':'Formeln stimmen'} noch nicht. Prüfe <strong>${html(name)}</strong>${sample?' (deine Eingabe: '+html(sample)+')':''}. ${/^\d/.test(sample||'')?'Zahlen vor der Formel kommen erst in Schritt 2.':''}`);return}state.stage=2;state.hints=0;render();message('Alle Stoffformeln stimmen. Jetzt kannst du die Gleichung ausgleichen.','good');work.querySelector('[data-coef]')?.focus()}
  function countsFor(t,coefs,side){let total={};const offset=side==='lhs'?0:t.lhs.length;const entries=side==='lhs'?t.lhs:t.rhs;entries.forEach((x,i)=>{for(const [element,n] of Object.entries(parseFormula(x[1]))){total[element]=(total[element]||0)+n*coefs[offset+i]}});return total}
  function atomTable(t,coefs){const l=countsFor(t,coefs,'lhs'),r=countsFor(t,coefs,'rhs');const elems=[...new Set([...Object.keys(l),...Object.keys(r)])];return {ok:elems.every(k=>l[k]===r[k]),html:`<table class="atoms"><thead><tr><th>Atom</th><th>Links</th><th>Rechts</th></tr></thead><tbody>${elems.map(k=>`<tr><td>${k}</td><td class="${l[k]===r[k]?'match':'mismatch'}">${l[k]||0}</td><td class="${l[k]===r[k]?'match':'mismatch'}">${r[k]||0}</td></tr>`).join('')}</tbody></table>`}}
  function checkCoefficients(){saveCoefs();let invalid=[];const coefs=state.coefs.map((s,i)=>{const str=String(s).trim();const valid=str===''||/^[1-9]\d*$/.test(str)&&Number.isSafeInteger(Number(str))&&Number(str)<=999;work.querySelector(`[data-coef="${i}"]`).classList.toggle('wrong',!valid);if(!valid)invalid.push(i);return str===''?1:Number(str)});if(invalid.length){message('Trage nur ganze positive Zahlen von 1 bis 999 ein. Ein leeres Feld zählt als 1.');return}const table=atomTable(task(),coefs);if(!table.ok){message('Die Anzahl der Atome ist links und rechts noch unterschiedlich. Prüfe die markierten Zahlen in der Tabelle.','bad',table.html);return}const divisor=coefs.reduce((a,b)=>gcd(a,b));if(divisor>1){message(`Die Gleichung stimmt, aber alle Zahlen lassen sich noch durch ${divisor} teilen. Verwende die kleinsten ganzen Zahlen.`,'bad',table.html);return}state.stage=3;if(!state.revealed){solved.add(task().id);persist()}fillPicker();render()}
  // Integer-Suchalgorithmus für die kleinen, kuratierten Aufgaben; keine feste Lösung im sichtbaren Aufgabentext.
  function balance(t){const entries=sides(t),matrix=[...new Set(entries.flatMap(x=>Object.keys(parseFormula(x[1]))))].map(e=>entries.map((x,j)=>(parseFormula(x[1])[e]||0)*(j<t.lhs.length?1:-1)));const n=entries.length,choice=Array(n).fill(1);let best=null,bestSum=Infinity;function visit(k,sum){if(sum+n-k>bestSum)return;if(k===n){if(choice.reduce((a,b)=>gcd(a,b))!==1)return;if(matrix.every(row=>row.reduce((a,b,j)=>a+b*choice[j],0)===0)&&sum<bestSum){best=[...choice];bestSum=sum}return}for(let v=1;v<=12;v++){choice[k]=v;visit(k+1,sum+v)}}visit(0,0);return best}
  function equation(t,coefs){const part=(items,offset)=>items.map((x,i)=>`${coefs[i+offset]===1?'':coefs[i+offset]+' '}${pretty(x[1])}`).join(' + ');return `${part(t.lhs,0)} → ${part(t.rhs,t.lhs.length)}`}
  function showSolution(){if(state.stage===1)saveFormulas();else saveCoefs();const t=task(),coeffs=balance(t);state.revealed=true;message(`Lösung: <strong class="eq-output">${equation(t,coeffs)}</strong><br>Du kannst die Eingaben weiter bearbeiten. Eine angezeigte Lösung zählt nicht als selbst gelöst.`,'good')}
  function finish(){const t=task(),coefs=state.coefs.map(x=>x===''?1:Number(x));byId('feedback').outerHTML=`<div class="finish" role="status"><h3>Richtig ausgeglichen!</h3><div class="eq-output">${equation(t,coefs)}</div><p>${state.revealed?'Du hast zuvor die Lösung angezeigt. Diese Aufgabe zählt erst beim erneuten Üben zum Fortschritt.':'Links und rechts gibt es von jedem Element gleich viele Atome.'}</p><button class="primary" id="finish-next" type="button">Nächste Aufgabe →</button></div>`;byId('finish-next').addEventListener('click',()=>nav(1))}
  category.innerHTML='<option value="all">Alle Themen</option>'+categories.map(c=>`<option value="${c.id}">${html(c.name)}</option>`).join('');
  category.addEventListener('change',()=>{const first=filtered()[0];if(first)load(first.id)});picker.addEventListener('change',()=>load(picker.value));byId('previous').addEventListener('click',()=>nav(-1));byId('next').addEventListener('click',()=>nav(1));fillPicker();render();
  </script>
</body>
</html>
